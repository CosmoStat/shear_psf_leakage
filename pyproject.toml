[project]
name = "shear_psf_leakage"
version = "0.2.1"
description = "PSF leakage for shear catalogue data"
authors = [
    {name = "Martin Kilbinger", email = "martin.kilbinger@cea.fr"},
    {name = "Sacha Guerrini", email = "sacha.guerrini@cea.fr"},
    {name = "Clara Bonini", email = "clara.bonini@universite-paris-saclay.fr"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lmfit>=1.2.2",
    "treecorr>=4.3.3",
    "uncertainties>=3.1.7",
    "matplotlib>=3.7.2",
    "pandas>=2.0.3",
    "scipy>=1.13",
    "getdist>=1.4.7",
    "tqdm>=4.66.2",
    "emcee>=3.1.4",
    # Keep the released cs_util range shared by the UNIONS stack.
    "cs_util>=0.1.0,<0.3",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "notebook>=5.7.4",
    "jupyter-server>=2.8.0",
    "jupyterlab>=4.0.7",
    "tornado>=6.3.3",
    "jupytext>=1.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "black",
    "pre-commit",
    "pydocstyle",
]

[project.scripts]
leakage_scale = "shear_psf_leakage.leakage_scale:main"
leakage_object = "shear_psf_leakage.leakage_object:main"

[tool.black]
line-length = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
