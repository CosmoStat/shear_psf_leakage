[project]
name = "shear_psf_leakage"
version = "0.2.1"
description = "PSF leakage for shear catalogue data"
authors = [
    {name = "Martin Kilbinger", email = "martin.kilbinger@cea.fr"},
    {name = "Sacha Guerrini", email = "sacha.guerrini@cea.fr"},
    {name = "Clara Bonini", email = "clara.bonini@universite-paris-saclay.fr"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "swig>=4.1.1",
    "pyyaml>=6.0.1",
    "lmfit>=1.2.2",
    "treecorr>=4.3.3",
    "uncertainties>=3.1.7",
    "matplotlib>=3.7.2",
    "stats>=0.1.2a0",
    "pandas>=2.0.3",
    "camb>=1.5.9",
    # Cap scipy < 1.18: scipy 1.18 ported FITPACK from Fortran to C, changing
    # RectBivariateSpline(scalar, scalar, grid=False) from a 0-d array to a
    # shape-(1,) array. camb's BBN Y_He predictor then fails set_cosmology with
    # "only 0-dimensional arrays can be converted to Python scalars", breaking
    # every get_cosmo path (and pyccl's Boltzmann spline path likewise). camb
    # 1.6.6 is unfixed; lift the cap when camb ships the scipy-1.18 fix. Mirrors
    # the same cap in sp_validation.
    "scipy>=1.13,<1.18",
    "lenspack>=1.0.0",
    "pyccl>=3.0.0",
    "getdist>=1.4.7",
    "tqdm>=4.66.2",
    "emcee>=3.1.4",
    "gsl>=0.0.3",
    # Keep the released cs_util range shared by the UNIONS stack.
    "cs_util>=0.1.0,<0.3",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0.0",
    "notebook>=5.7.4",
    "jupyter-server>=2.8.0",
    "jupyterlab>=4.0.7",
    "tornado>=6.3.3",
    "jupytext>=1.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "black",
    "pre-commit",
    "pydocstyle",
]

[project.scripts]
leakage_scale = "shear_psf_leakage.leakage_scale:main"
leakage_object = "shear_psf_leakage.leakage_object:main"

[tool.black]
line-length = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
